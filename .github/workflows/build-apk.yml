name: APK qurish va chiqarish

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: APK qurish
    runs-on: ubuntu-latest

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android signing secretlarini tekshirish
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret topilmadi"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret topilmadi"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS secret topilmadi"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD secret topilmadi"; exit 1; }
          echo "Signing secretlar mavjud."

      - name: Paketlarni o'rnatish
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Doimiy Android keystore'ni tiklash
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

          keytool -list \
            -keystore android/app/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          cat >> android/gradle.properties <<EOF
          MYAPP_UPLOAD_STORE_FILE=release.keystore
          MYAPP_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS
          MYAPP_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          MYAPP_UPLOAD_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF

          echo "Doimiy keystore tiklandi va tekshirildi."

      - name: Release signingConfig ulash
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")

          def find_block(text, marker, start=0):
              m = re.search(marker, text[start:])
              if not m:
                  raise SystemExit(f"Blok topilmadi: {marker}")
              marker_start = start + m.start()
              open_brace = text.find("{", marker_start)
              if open_brace < 0:
                  raise SystemExit(f"Ochuvchi qavs topilmadi: {marker}")

              depth = 0
              quote = None
              escape = False
              line_comment = False
              block_comment = False
              i = open_brace

              while i < len(text):
                  ch = text[i]
                  nx = text[i + 1] if i + 1 < len(text) else ""

                  if line_comment:
                      if ch == "\n":
                          line_comment = False
                      i += 1
                      continue

                  if block_comment:
                      if ch == "*" and nx == "/":
                          block_comment = False
                          i += 2
                      else:
                          i += 1
                      continue

                  if quote:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue

                  if ch == "/" and nx == "/":
                      line_comment = True
                      i += 2
                      continue

                  if ch == "/" and nx == "*":
                      block_comment = True
                      i += 2
                      continue

                  if ch in ("'", '"'):
                      quote = ch
                      i += 1
                      continue

                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return marker_start, open_brace, i

                  i += 1

              raise SystemExit(f"Yopuvchi qavs topilmadi: {marker}")

          if "MYAPP_UPLOAD_STORE_FILE" not in s:
              _, signing_open, _ = find_block(s, r"\bsigningConfigs\s*\{")

              release_config = '''
                  release {
                      if (project.hasProperty("MYAPP_UPLOAD_STORE_FILE")) {
                          storeFile file(MYAPP_UPLOAD_STORE_FILE)
                          storePassword MYAPP_UPLOAD_STORE_PASSWORD
                          keyAlias MYAPP_UPLOAD_KEY_ALIAS
                          keyPassword MYAPP_UPLOAD_KEY_PASSWORD
                      }
                  }
          '''

              s = s[:signing_open + 1] + release_config + s[signing_open + 1:]

          _, build_open, build_close = find_block(s, r"\bbuildTypes\s*\{")

          rel_match = re.search(r"\brelease\s*\{", s[build_open + 1:build_close])
          if not rel_match:
              raise SystemExit("buildTypes ichida release bloki topilmadi")

          rel_start = build_open + 1 + rel_match.start()
          _, _, release_close = find_block(s, r"\brelease\s*\{", rel_start)

          release_block = s[rel_start:release_close + 1]

          if "signingConfig signingConfigs.release" not in release_block:
              if "signingConfig signingConfigs.debug" in release_block:
                  release_block = release_block.replace(
                      "signingConfig signingConfigs.debug",
                      "signingConfig signingConfigs.release",
                      1
                  )
              else:
                  pos = release_block.find("{") + 1
                  release_block = (
                      release_block[:pos]
                      + "\n            signingConfig signingConfigs.release"
                      + release_block[pos:]
                  )

              s = s[:rel_start] + release_block + s[release_close + 1:]

          p.write_text(s, encoding="utf-8")

          final = p.read_text(encoding="utf-8")
          if "MYAPP_UPLOAD_STORE_FILE" not in final:
              raise SystemExit("release signingConfigs yozilmadi")
          if "signingConfig signingConfigs.release" not in final:
              raise SystemExit("buildTypes.release release signing'ga ulanmagan")

          print("Release signingConfig build.gradle'ga muvaffaqiyatli ulandi.")
          PY

      - name: Gradle signing konfiguratsiyasini tekshirish
        shell: bash
        run: |
          set -euo pipefail
          grep -q "MYAPP_UPLOAD_STORE_FILE" android/app/build.gradle
          grep -q "signingConfig signingConfigs.release" android/app/build.gradle
          test -s android/app/release.keystore
          echo "Gradle signing konfiguratsiyasi tayyor."

      - name: APK yig'ish
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: APK mavjudligini tekshirish
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: APK imzosini tekshirish
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: APK nomini o'zgartirish
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/release/app-release.apk build_output/Kunlik_Hisobot_V4.apk

      - name: GitHub Release'ga chiqarish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.${{ github.run_number }}
          name: "Kunlik Hisobot v4.0.${{ github.run_number }}"
          body: "Xisobot Mobile V4 — Vazifalar markazi. APK doimiy Android release key bilan imzolangan."
          draft: false
          prerelease: false
          files: build_output/Kunlik_Hisobot_V4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
