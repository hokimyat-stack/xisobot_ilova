name: APK qurish va chiqarish

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: APK qurish
    runs-on: ubuntu-latest

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android signing secretlarini tekshirish
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret topilmadi"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret topilmadi"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS secret topilmadi"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD secret topilmadi"; exit 1; }

      - name: Paketlarni o'rnatish
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Doimiy Android keystore'ni tiklash
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          keytool -list \
            -keystore android/app/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Release signingConfig ulash
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Expo/EAS usuliga o'xshash alohida Gradle signing skript.
          # Bu generated build.gradle ichidagi nested bloklarni regex bilan qidirishni talab qilmaydi.
          cat > android/app/xisobot-signing.gradle <<'EOF'
          android {
              signingConfigs {
                  release {
                      // Config tasks.whenTaskAdded ichida beriladi.
                  }
              }

              buildTypes {
                  release {
                      // Release type mavjud bo'lmasa ham Gradle DSL uchun xavfsiz.
                  }
              }
          }

          tasks.whenTaskAdded {
              android.signingConfigs.release {
                  storeFile file("release.keystore")
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }

              android.buildTypes.release {
                  signingConfig android.signingConfigs.release
              }
          }
          EOF

          # Prebuild har safar build.gradle yaratadi. Biz faqat oxiriga apply qo'shamiz.
          if ! grep -Fq 'apply from: "./xisobot-signing.gradle"' android/app/build.gradle; then
            printf '\napply from: "./xisobot-signing.gradle"\n' >> android/app/build.gradle
          fi

          echo "Signing Gradle script ulandi."

      - name: APK yig'ish
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: APK mavjudligini tekshirish
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          ls -lh "$APK"

      - name: APK imzosini tekshirish
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: APK nomini o'zgartirish
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/release/app-release.apk build_output/Kunlik_Hisobot_V4.apk

      - name: GitHub Release'ga chiqarish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.${{ github.run_number }}
          name: "Kunlik Hisobot v4.0.${{ github.run_number }}"
          body: "Xisobot Mobile V4 — Vazifalar markazi. APK doimiy Android release key bilan imzolangan."
          draft: false
          prerelease: false
          files: build_output/Kunlik_Hisobot_V4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
