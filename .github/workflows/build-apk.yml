name: APK qurish va chiqarish

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: APK qurish
    runs-on: ubuntu-latest

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Paketlarni o'rnatish
        run: |
          npm install --legacy-peer-deps

      - name: Expo Prebuild (Android fayllarini yaratish)
        run: |
          npx expo prebuild --platform android --no-install

      - name: Vaqtinchalik Keystore yaratish va sozlash
        run: |
          cd android/app
          keytool -genkeypair -v -keystore release.keystore -alias hisobot-key -keyalg RSA -keysize 2048 -validity 10000 -storepass hisobot123 -keypass hisobot123 -dname "CN=Hisobot, OU=SysOne, O=SysOne, L=Tashkent, C=UZ"
          
          cat >> ../gradle.properties << EOF
          MYAPP_UPLOAD_STORE_FILE=release.keystore
          MYAPP_UPLOAD_KEY_ALIAS=hisobot-key
          MYAPP_UPLOAD_STORE_PASSWORD=hisobot123
          MYAPP_UPLOAD_KEY_PASSWORD=hisobot123
          EOF

      - name: Gradle imzolash sozlamasini ulash
        run: |
          python3 - << 'PYEOF'
          p = 'android/app/build.gradle'
          with open(p, 'r') as f:
              content = f.read()
          
          signing_code = """
                  release {
                      if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                          storeFile file(MYAPP_UPLOAD_STORE_FILE)
                          storePassword MYAPP_UPLOAD_STORE_PASSWORD
                          keyAlias MYAPP_UPLOAD_KEY_ALIAS
                          keyPassword MYAPP_UPLOAD_KEY_PASSWORD
                      }
                  }
          """
          if 'signingConfigs {' in content and 'release {' not in content:
              content = content.replace('signingConfigs {', 'signingConfigs {' + signing_code)
              content = content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
              with open(p, 'w') as f:
                  f.write(content)
          PYEOF

      - name: APK yig'ish (Gradle build)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: APK nomini o'zgartirish
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/release/app-release.apk build_output/Kunlik_Hisobot.apk

      - name: GitHub Release'ga chiqarish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: "Kunlik Hisobot v3.0.${{ github.run_number }}"
          body: "Yangi stabil versiya (Supabase + Cloudflare R2 integratsiyasi bilan)."
          draft: false
          prerelease: false
          files: build_output/Kunlik_Hisobot.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
